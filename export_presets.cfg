; The release export presets. COMMITTED, per docs/14 §10.3's Commit row — and
; per the same row it must never carry a keystore password or any other secret;
; signing credentials come from environment variables if signing is ever added.
;
; Hand-written rather than produced by the editor GUI: the engine is behind the
; project's mutex (tools/with_godot_lock.sh) and a headless loop never opens the
; editor, so this file is authored and read as text. Godot fills in any option
; omitted here with its own default, which is why only the options that matter
; to this project are stated.
;
; Windows Desktop x86_64 is the primary target (docs/14 §10.1). Linux x86_64 is
; the second target that doc asks for "from day one" — it costs one preset and
; is the cheapest way to catch a platform-dependent float or path bug. Only the
; Windows preset is launch-checked by tools/export_build.sh; a Linux binary
; cannot be run on the build machine, so that preset is export-only and the
; script says so rather than pretending it was verified.
;
; Two options here are load-bearing for the gates in tools/export_build.sh:
;   binary_format/embed_pck=false   keeps a separate .pck, which is what makes
;                                   the pck-hygiene grep (docs/14 §10.1 gate 6)
;                                   possible at all — an embedded pck hides the
;                                   resource paths inside the .exe.
;   debug/export_console_wrapper=2  produces AGuildStory.console.exe, whose
;                                   stdout the launch check reads. Without it a
;                                   headless launch has nothing to assert on.
;                                   The value must be 2 ("Debug and Release"),
;                                   not 1: 1 is debug-only and this script only
;                                   ever runs --export-release, so 1 produced no
;                                   wrapper at all and the launch check had
;                                   nothing to run. Measured, not assumed.
;
; exclude_filter lists FILE TYPES only. Whole directories are kept out of the
; pack by .gdignore (docs/14 §4 and §10.3), never by this filter — the two lists
; are separate for the same reason .gitignore and .gdignore are.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.aseprite,*.md,*.py,*.lua,*.sh,*.ps1,*.log"
export_path="build/exports/AGuildStory.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
; The executable's own icon is a real .ico (256/128/64/48/32/24/16), written by
; tools/art/gen_wordmark.py from the same 256x256 plate project.godot names as
; config/icon — one mark, two containers. The console wrapper (see
; export_console_wrapper above) gets the same one so Explorer shows one icon.
application/icon="res://game/assets/ui/icon.ico"
application/console_wrapper_icon="res://game/assets/ui/icon.ico"
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="A Guild Story"
application/product_name="A Guild Story"
application/file_description="Manage a guild of incompetent raiders."
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false

[preset.1]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="*.aseprite,*.md,*.py,*.lua,*.sh,*.ps1,*.log"
export_path="build/exports/AGuildStory.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
